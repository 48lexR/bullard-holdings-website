services:
    http:
        build: .
        env_file: .env
        ports:
            - "80:80/tcp"
        depends_on:
            - database
        restart: always
        volumes:
          - ./src/:/var/www/html/:ro,z

    database:
        image: mariadb
        container_name: "mariadb"
        env_file: .env
        restart: always
        volumes:
            - mariadb_data:/var/lib/mysql
            - ./init:/docker-entrypoint-initdb.d:ro,z

volumes:
    mariadb_data:
