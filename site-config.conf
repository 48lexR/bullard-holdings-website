<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Serve index.php first, then fall back to index.html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand .php files to the PHP module bundled with php:apache
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Make sure CSS and other static assets get correct MIME types
    AddType text/css .css
    AddType application/javascript .js

    # Block access to hidden files like .git or .env
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
